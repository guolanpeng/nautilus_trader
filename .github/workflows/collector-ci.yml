name: collector-ci

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "collector/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/collector-ci.yml"
  pull_request:
    paths:
      - "collector/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/collector-ci.yml"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build collector
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Common setup
        uses: ./.github/actions/common-setup
        with:
          python-version: "3.13"
          free-disk-space: "true"
          build-type: "release"
          rust-cache-key: "collector-ci"

      - name: Check collector formatting
        run: cargo fmt --package collector -- --check

      - name: Check collector
        run: cargo check -p collector

      - name: Build collector release binary
        run: cargo build --profile collector-release -p collector

      - name: Upload collector binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collector-ubuntu-24.04-x86_64
          path: target/collector-release/collector
